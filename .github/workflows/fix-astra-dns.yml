name: Fix astra.jakesarcade.app DNS + Pages domain

on:
  workflow_dispatch:

jobs:
  fix-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create CNAME and attach Pages custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          TOKEN="${CLOUDFLARE_API_TOKEN}"
          CUSTOM_DOMAIN="astra.jakesarcade.app"
          APEX="jakesarcade.app"
          SUB="astra"
          CNAME_TARGET="astrabound-4ov.pages.dev"
          PROJECT_NAME="astrabound"

          echo "--- Looking up account ID ---"
          ACCOUNT_ID=$(curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "Account: ${ACCOUNT_ID}"

          echo "--- Looking up zone ID for ${APEX} ---"
          ZONE_ID=$(curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${APEX}&status=active&per_page=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "Zone: ${ZONE_ID}"

          echo "--- Checking existing DNS record ---"
          EXISTING=$(curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${CUSTOM_DOMAIN}")
          COUNT=$(echo "$EXISTING" | python3 -c "import sys,json; print(len(json.load(sys.stdin)['result']))")

          if [ "$COUNT" -gt "0" ]; then
            RECORD_ID=$(echo "$EXISTING" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
            CONTENT=$(echo "$EXISTING" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['content'])")
            echo "Record exists: ${CONTENT}"
            if [ "$CONTENT" != "$CNAME_TARGET" ]; then
              echo "Wrong target — updating to ${CNAME_TARGET}..."
              curl -fsS -X PUT \
                "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"CNAME\",\"name\":\"${SUB}\",\"content\":\"${CNAME_TARGET}\",\"proxied\":true,\"ttl\":1}" \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print('Updated:', d['result']['name'], '->', d['result']['content']) if d['success'] else print(d)"
            else
              echo "CNAME already correct."
            fi
          else
            echo "Creating CNAME ${SUB} → ${CNAME_TARGET} (proxied)..."
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"${SUB}\",\"content\":\"${CNAME_TARGET}\",\"proxied\":true,\"ttl\":1}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('Created:', d['result']['name'], '->', d['result']['content']) if d['success'] else (print(d), exit(1))"
          fi

          echo "--- Attaching Pages custom domain ---"
          RESP=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${CUSTOM_DOMAIN}\"}")
          echo "$RESP" | python3 -c "
import sys,json
d=json.load(sys.stdin)
if not d['success']:
    msg=str(d.get('errors',''))
    if 'already' in msg.lower():
        print('Custom domain already attached — OK')
    else:
        print(d); exit(1)
else:
    r=d['result']
    print('Domain:', r['name'], '| Status:', r.get('status','?'))
"

          echo "--- Done. https://${CUSTOM_DOMAIN}/ should resolve within a few minutes. ---"
