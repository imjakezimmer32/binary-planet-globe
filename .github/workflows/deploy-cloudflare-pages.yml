# Deploys static files to Cloudflare Pages project "astrabound" (production branch: main).
# Live site: https://astrabound-4ov.pages.dev/
# If deploys ever go to the wrong place, check Workers & Pages → project name must be "astrabound".
#
# When this runs
# ---------------
# GitHub runs this workflow on every **push** to `main`. Merging a pull request into `main`
# (merge commit, squash merge, or rebase merge) creates that push — so production deploy
# happens automatically after each merge.
#
# Setup (one time)
# ----------------
# Repository → Settings → Secrets and variables → Actions → New repository secret:
#   CLOUDFLARE_API_TOKEN — API token with Cloudflare Pages (and Workers) edit permission
#   for the account that owns the `astrabound` Pages project.
#
# Manual run: Actions tab → "Deploy to Cloudflare Pages" → Run workflow.
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-astrabound-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRABOUND_PRODUCTION_URL: https://astrabound-4ov.pages.dev/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure astrabound Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages project create astrabound --production-branch main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler pages deploy --project-name astrabound --branch main
          echo "Production URL (pages.dev): ${ASTRABOUND_PRODUCTION_URL}"
