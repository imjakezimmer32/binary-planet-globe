# Deploys to Pages project "astrabound" → production URL https://astra.jakesarcade.app/
# (CNAME: astra.jakesarcade.app → astrabound-4ov.pages.dev. Do NOT use astrabound.pages.dev — different site.)
#
# When this runs
# ---------------
# GitHub runs this workflow on every **push** to `main`. Merging a pull request into `main`
# (merge commit, squash merge, or rebase merge) creates that push — so production deploy
# happens automatically after each merge.
#
# Setup (one time)
# ----------------
# Repository → Settings → Secrets and variables → Actions → New repository secret:
#   CLOUDFLARE_API_TOKEN — API token with Cloudflare Pages (and Workers) edit permission
#   for the account that owns the `astrabound` Pages project.
#
# Manual run: Actions tab → "Deploy to Cloudflare Pages" → Run workflow.
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-astrabound-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRABOUND_PRODUCTION_URL: https://astra.jakesarcade.app/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages project create astrabound --production-branch main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
          PAGES_PROJECT_NAME: astrabound
        run: |
          npx wrangler pages deploy --project-name astrabound --branch main
          bash scripts/cloudflare-pages-domain.sh || echo "Custom domain / DNS step failed — see log above."
          echo "Live game: ${ASTRABOUND_PRODUCTION_URL}"
